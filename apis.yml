    REST APIs for querying and collecting data from an Unravel instance —
    application details, recommendations and logs, apps search, cluster
    operations and resource metrics, chargeback reports, queue analysis,
    anomaly detection, and pipeline monitoring. Requests and responses are
    JSON, authorized with an API token sent in an Authorization JWT header.
