aid: unravel
name: Unravel
description: >-
  Unravel is an AI-powered data observability and FinOps platform that helps
  data teams optimize performance, control costs, and troubleshoot data
  pipelines across Databricks, Snowflake, Google BigQuery, Amazon EMR, and
  Cloudera. Each Unravel instance exposes REST APIs for application
  performance data, cluster operations and resource metrics, chargeback
  reporting, anomaly detection, and pipeline monitoring, authorized with API
  tokens created in the Unravel UI.
